<script>

const video = document.getElementById("myVideo");

const engTrack = video.addTextTrack("subtitles","English","en");
const spaTrack = video.addTextTrack("subtitles","Spanish","es");

engTrack.mode = "showing";
spaTrack.mode = "hidden";

function loadVTT(track, text){

const lines = text.trim().split("\n\n").slice(1);

lines.forEach(block => {

const parts = block.split("\n");
const time = parts[0];
const caption = parts.slice(1).join("\n");

const times = time.split(" --> ");

const cue = new VTTCue(
parseTime(times[0]),
parseTime(times[1]),
caption
);

track.addCue(cue);

});

}

function parseTime(t){
const p = t.split(":");
return (+p[0])*3600 + (+p[1])*60 + parseFloat(p[2]);
}

loadVTT(engTrack, document.getElementById("engVTT").textContent);
loadVTT(spaTrack, document.getElementById("spaVTT").textContent);


document.getElementById("switchEnglish").onclick = () => {
engTrack.mode="showing";
spaTrack.mode="hidden";
};

document.getElementById("switchSpanish").onclick = () => {
engTrack.mode="hidden";
spaTrack.mode="showing";
};

</script>
